name: thredo
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  cached_network_image: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_screenutil: ^5.9.3
  toastification: ^3.2.0
  loading_animation_widget: ^1.3.0
  intl: ^0.20.2
  dio: ^5.11.1
  http_cache_hive_store: ^5.1.1
  dio_cache_interceptor: ^4.0.7
  dio_smart_retry: ^7.0.1
  shared_preferences: ^2.5.5
  pretty_dio_logger: ^1.4.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  url_launcher: ^6.3.2
  pin_code_fields: ^9.4.0
  image_picker: ^1.2.3
  http: ^1.6.0
  path: ^1.9.1
  permission_handler: ^13.0.2
  camera: ^0.12.1
  dotted_border: ^3.1.0
  overlay_support: ^2.1.0
  pull_to_refresh: ^2.0.0
  shimmer: ^4.0.0
  image_cropper: ^12.2.1
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_inappwebview: ^6.1.5
  flutter_widget_from_html: ^0.17.3
  country_picker: ^2.0.28
  smooth_page_indicator: ^3.0.0
  chip_list: ^3.1.0
  flutter_switch: ^0.3.2
  linear_progress_bar: ^3.0.0
  flutter_card_swiper: ^7.2.0
  sliding_up_panel: ^2.0.0+1
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  video_player: ^2.14.0
  visibility_detector: ^0.4.0+2
  flutter_cache_manager: ^3.4.2
  gif_view: ^1.0.3
  infinite_scroll_pagination: ^5.1.1 # for infinite scroll
  share_plus: ^13.3.0
  whatsapp_share_plus: ^1.0.2
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/png/
    - assets/fonts/
    - assets/gif/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/PoppinsLight.ttf
          weight: 300
        - asset: assets/fonts/PoppinsRegular.ttf
          weight: 400
        - asset: assets/fonts/PoppinsMedium.ttf
          weight: 500
        - asset: assets/fonts/PoppinsSemiBold.ttf
          weight: 600
        - asset: assets/fonts/PoppinsBold.ttf
          weight: 700
